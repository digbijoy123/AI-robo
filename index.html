<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f18">
<title>ROBO AIOS — v2.7</title>
<style>
:root{
  --void:#090d15;
  --panel:#111827;
  --panel2:#172033;
  --screen:#f8ead7;
  --screen2:#ffd5ae;
  --ink:#29233c;
  --muted:#778198;
  --cyan:#5fd4d0;
  --amber:#f0b45b;
  --coral:#ff7654;
  --green:#55c58c;
  --red:#e95c67;
  --blue:#77a8ff;
  --pink:#ef7fae;
  --white:#fffaf4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:var(--white)}
button{font:inherit}
#app{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 35%,rgba(95,212,208,.08),transparent 32%),
  linear-gradient(rgba(95,212,208,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(95,212,208,.025) 1px,transparent 1px);
background-size:auto,32px 32px,32px 32px}
.device{position:relative;width:min(94vw,520px);height:min(94vh,900px);padding:17px;border:1px solid #272d3c;border-radius:38px;background:#121622;box-shadow:inset 0 0 0 2px #1b2030,0 30px 80px rgba(0,0,0,.45);transition:width .35s,height .35s}
.device.landscape{width:min(94vw,1000px);height:min(88vh,600px)}
.notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:78px;height:8px;border-radius:10px;background:#020307;z-index:50}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:27px;background:
  radial-gradient(circle at 50% 25%,rgba(255,255,255,.42),transparent 34%),
  radial-gradient(circle at 50% 100%,var(--screen2),var(--screen) 68%);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 0 45px rgba(255,255,255,.12)}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:.08;background:linear-gradient(transparent 50%,rgba(44,36,64,.18) 51%);background-size:100% 6px;z-index:1}

/* HUD */
.hud{position:absolute;top:15px;left:15px;right:15px;z-index:30}
.hudTop{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px}
.brand{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.brand small{opacity:.45;font-weight:500}
.stateChip,.battery,.devBtn{border:1px solid rgba(44,36,64,.10);background:rgba(255,255,255,.38);color:var(--ink);border-radius:18px;padding:7px 9px;font-size:8px;white-space:nowrap}
.stateChip{letter-spacing:.1em}
.hudBottom{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:15px;background:rgba(255,255,255,.40);color:var(--ink);font-size:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:none}
.dot.ok{background:var(--green);box-shadow:0 0 9px rgba(85,197,140,.55)}
.dot.live{background:var(--cyan);box-shadow:0 0 9px rgba(95,212,208,.6);animation:blinkDot 1.1s infinite}
@keyframes blinkDot{50%{opacity:.35}}

/* Camera */
.camera{position:absolute;right:15px;top:103px;width:128px;height:94px;border-radius:20px;overflow:hidden;background:#080b11;border:2px solid rgba(255,255,255,.75);box-shadow:0 12px 28px rgba(44,36,64,.22);z-index:25}
.camera video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.camera .camLabel{position:absolute;left:8px;bottom:6px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:7px}
.camera .camRec{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.camera.empty::after{content:"CAMERA OFF";position:absolute;inset:0;display:grid;place-items:center;color:#7c8598;font-size:8px;letter-spacing:.08em}

/* Avatar zone */
.avatarZone{position:absolute;left:12px;right:12px;top:125px;bottom:205px;display:grid;place-items:center;z-index:8}
.orbit{position:relative;width:min(82vw,470px);height:min(82vw,470px);max-height:100%;aspect-ratio:1}
.ring{position:absolute;border-radius:50%;inset:0;border:1px solid rgba(44,36,64,.14);pointer-events:none}
.ring.r1{inset:0;animation:spin 30s linear infinite}
.ring.r2{inset:8%;border-style:dashed;animation:spinReverse 18s linear infinite}
.ring.r3{inset:17%;border-color:rgba(95,212,208,.22)}
.ring i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);left:50%;top:-4px;transform:translateX(-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
.pulse{position:absolute;inset:17%;border:2px solid var(--cyan);border-radius:50%;opacity:0}
.state-listening .pulse{animation:pulseOut 1.2s infinite}
.state-thinking .pulse{border-color:var(--amber);animation:pulseOut 1.7s infinite}
.state-talking .pulse{border-color:var(--green);animation:pulseOut .55s infinite}
@keyframes pulseOut{0%{transform:scale(.85);opacity:.65}100%{transform:scale(1.2);opacity:0}}

/* 3D floating emoji avatar. Canvas draws the face so every emotion is programmable. */
#face{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:6;filter:drop-shadow(0 22px 25px rgba(44,36,64,.16));animation:float 4s ease-in-out infinite;pointer-events:none}
.emojiFallback{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-size:clamp(120px,30vw,210px);line-height:1;opacity:1;filter:drop-shadow(0 18px 22px rgba(15,22,35,.20));pointer-events:none;transition:opacity .25s ease}
.emojiFallback.hidden{opacity:0}
.avatarHint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:7;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:rgba(44,36,64,.32);white-space:nowrap;pointer-events:none}
@keyframes float{50%{transform:translateY(-7px)}}

/* Developer state list is easy to test on desktop and phone. */
.devPanel{position:absolute;left:15px;right:15px;top:205px;z-index:40;padding:10px;border:1px solid rgba(255,255,255,.45);border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);box-shadow:0 14px 30px rgba(44,36,64,.12);display:none}
.devPanel.open{display:block}
.devTitle{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:8px;letter-spacing:.1em;margin-bottom:8px}
.stateGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:270px;overflow:auto;padding-right:2px}
.stateBtn{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid rgba(44,36,64,.10);background:rgba(255,255,255,.62);color:var(--ink);border-radius:10px;padding:5px 3px;font-size:7px;cursor:pointer}
.stateBtn small{font-size:6px;opacity:.62;text-transform:none;text-align:center}
.stateBtn.active{background:var(--ink);color:#fff}
.log{margin-top:8px;max-height:72px;overflow:hidden;border-top:1px solid rgba(44,36,64,.10);padding-top:6px;color:#657086;font-size:7px;line-height:1.5}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Status / caption */
.status{position:absolute;left:50%;transform:translateX(-50%);bottom:159px;z-index:26;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:15px;background:rgba(255,255,255,.42);color:var(--ink);font-size:8px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.caption{position:absolute;left:15px;right:15px;bottom:84px;min-height:74px;padding:10px 13px;border:1px solid rgba(255,255,255,.58);border-radius:19px;background:rgba(255,255,255,.44);color:var(--ink);z-index:27;box-shadow:0 10px 25px rgba(44,36,64,.09);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.caption.show{opacity:1;transform:none}
.captionTitle{font-size:7px;color:var(--coral);letter-spacing:.12em;margin-bottom:5px}
.captionText{font-size:10px;line-height:1.4;display:block;padding-right:52px}
.bars{position:absolute;right:13px;bottom:12px;display:flex;align-items:center;gap:3px}
.bars i{width:3px;height:8px;border-radius:3px;background:var(--coral);opacity:.35}
.caption.show .bars i{animation:bar .5s ease-in-out infinite alternate}
.voiceDiag{margin-top:6px;display:flex;align-items:center;gap:7px;font-size:7px;letter-spacing:.08em;opacity:.78;text-transform:uppercase}
.voiceDiag .diagDot{width:6px;height:6px;border-radius:50%;background:#a9a9a9;box-shadow:0 0 0 0 transparent;transition:.2s}
.voiceDiag .diagDot.ready{background:var(--green);box-shadow:0 0 8px rgba(85,197,140,.45)}
.voiceDiag .diagDot.live{background:var(--coral);box-shadow:0 0 9px rgba(255,118,84,.55);animation:diagPulse .8s ease-in-out infinite}
.voiceDiag .diagDot.error{background:var(--red)}
.voiceLevel{display:flex;align-items:flex-end;gap:2px;height:10px;margin-left:auto}
.voiceLevel i{width:3px;height:4px;border-radius:3px;background:var(--cyan);opacity:.25;transition:height .06s,opacity .06s}
.voiceLevel.active i{opacity:.9}
@keyframes diagPulse{0%,100%{opacity:1}50%{opacity:.35}}

.bars i:nth-child(2){animation-delay:.08s}.bars i:nth-child(3){animation-delay:.16s}.bars i:nth-child(4){animation-delay:.24s}.bars i:nth-child(5){animation-delay:.32s}
@keyframes bar{to{height:18px;opacity:.9}}

/* Bottom controls */
.bottom{position:absolute;left:15px;right:15px;bottom:12px;z-index:31;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mic{width:70px;height:70px;border:0;border-radius:50%;background:linear-gradient(150deg,#ff8a68,#d9603d);box-shadow:0 10px 24px rgba(217,96,61,.38),inset 0 1px 2px rgba(255,255,255,.65);display:grid;place-items:center;cursor:pointer}
.mic svg{width:28px;height:28px}
.mic.listening{animation:micPulse 1s infinite}
.mic.talking{animation:talkPulse .55s infinite alternate}
@keyframes micPulse{50%{box-shadow:0 10px 24px rgba(217,96,61,.38),0 0 0 13px rgba(255,118,84,0)}}
@keyframes talkPulse{to{transform:scale(1.06)}}
.modeBtn,.mediaBtn{border:1px solid rgba(44,36,64,.12);background:rgba(255,255,255,.42);color:var(--ink);border-radius:16px;padding:9px 10px;font-size:7px;cursor:pointer}
.actions{display:flex;gap:7px;align-items:center}

/* Developer panel */
.devPanel{position:absolute;left:15px;right:15px;top:205px;z-index:40;padding:10px;border:1px solid rgba(255,255,255,.45);border-radius:18px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);box-shadow:0 14px 30px rgba(44,36,64,.12);display:none}
.devPanel.open{display:block}
.devTitle{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:8px;letter-spacing:.1em;margin-bottom:8px}
.stateGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:230px;overflow:auto;padding-right:2px}
.stateBtn{min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.stateBtn small{font-size:6px;opacity:.62;text-transform:none}
.stateBtn{border:1px solid rgba(44,36,64,.10);background:rgba(255,255,255,.55);color:var(--ink);border-radius:10px;padding:5px 3px;font-size:7px;cursor:pointer}
.stateBtn.active{background:var(--ink);color:#fff}
.log{margin-top:8px;max-height:72px;overflow:hidden;border-top:1px solid rgba(44,36,64,.10);padding-top:6px;color:#657086;font-size:7px;line-height:1.5}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Desktop landscape */
.device.landscape .avatarZone{top:105px;bottom:120px;left:24%;right:24%}
.device.landscape .camera{left:18px;right:auto;top:100px;width:180px;height:128px}
.device.landscape .status{bottom:88px}
.device.landscape .caption{left:18px;right:210px;bottom:18px;min-height:52px}
.device.landscape .bottom{bottom:18px;left:auto;right:18px;width:170px;justify-content:flex-end}
.device.landscape .devPanel{left:auto;right:18px;top:100px;width:190px}
.device.landscape .hudBottom{max-width:480px}
.device.landscape #face{width:100%;height:100%}

/* Small phones */
@media(max-width:380px){
  .camera{width:108px;height:78px}
  .brand{font-size:12px}.stateChip,.battery,.pill{font-size:7px}
  .avatarZone{top:116px;bottom:190px}
  .caption{bottom:75px}
  .mic{width:64px;height:64px}
}
@media(min-width:700px){
  .device{width:min(88vw,560px);height:min(92vh,920px)}
  .device.landscape{width:min(94vw,1100px);height:min(86vh,650px)}
}
</style>
</head>
<body>
<div id="app">
  <main class="device" id="device">
    <div class="notch"></div>
    <section class="screen">
      <div class="scanlines"></div>

      <header class="hud">
        <div class="hudTop">
          <div class="brand">ROBO <small>v2.7</small></div>
          <div class="stateChip" id="stateChip">CURIOUS</div>
          <div class="battery" id="battery">82%</div>
        </div>
        <div class="hudBottom">
          <div class="pill"><span class="dot" id="mediaDot"></span><span id="mediaText">MEDIA OFF</span></div>
          <div class="pill"><span class="dot" id="bleDot"></span><span id="bleText">ROBOT OFFLINE</span></div>
        </div>
      </header>

      <div class="camera empty" id="cameraBox">
        <video id="camera" autoplay playsinline muted></video>
        <span class="camRec"></span>
        <span class="camLabel">what I see</span>
      </div>

      <section class="avatarZone">
        <div class="orbit">
          <div class="ring r1"><i></i></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="pulse"></div>
          <div class="emojiFallback" id="emojiFallback" aria-hidden="true">🙂</div>
          <canvas id="face" width="700" height="700" aria-label="Robo 3D floating emoji avatar"></canvas>
          <div class="avatarHint">ROBO EMOTION CORE</div>
        </div>
      </section>

      <div class="status"><span class="dot live" id="stateDot"></span><span id="statusText">curious · standing by</span></div>

      <div class="caption" id="caption" aria-live="polite">
        <div class="captionTitle">ROBO HEARS</div>
        <span class="captionText" id="captionText">Tap the microphone to let Robo listen…</span>
        <div class="voiceDiag"><span class="diagDot" id="voiceDiagDot"></span><span id="voiceDiagText">MIC IDLE · STT READY</span><span class="voiceLevel" id="voiceLevel"><i></i><i></i><i></i><i></i><i></i></span></div>
        <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
      </div>

      <div class="devPanel" id="devPanel">
        <div class="devTitle"><span>ROBO EMOTION STATES · TAP TO TEST</span><div style="display:flex;gap:6px;align-items:center"><button class="devBtn" id="autoStateBtn">AUTO IDLE: ON</button><button class="devBtn" id="closeDev">CLOSE</button></div></div>
        <div class="stateGrid" id="stateGrid"></div>
        <div class="log" id="log"></div>
      </div>

      <footer class="bottom">
        <div class="actions">
          <button class="modeBtn" id="orientationBtn">LANDSCAPE TEST</button>
          <button class="mediaBtn" id="mediaBtn">ENABLE CAM + MIC</button>
          <button class="modeBtn" id="devBtn">DEV STATES</button>
        </div>
        <button class="mic" id="micBtn" aria-label="Talk to Robo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <path d="M12 19v4"/>
          </svg>
        </button>
      </footer>

      <button class="devBtn" id="bleBtn" style="position:absolute;right:15px;top:64px;z-index:35;cursor:pointer">CONNECT ROBOT</button>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const device = $("#device");
  const canvas = $("#face");
  const ctx = canvas.getContext("2d");
  const caption = $("#caption");
  const captionText = $("#captionText");
  const micBtn = $("#micBtn");
  const voiceDiagDot = $("#voiceDiagDot");
  const voiceDiagText = $("#voiceDiagText");
  const voiceLevel = $("#voiceLevel");

  const STATES = [
    "neutral","happy","curious","sleepy","listening","thinking","talking",
    "excited","sad","surprised","angry","love","embarrassed","confused","alert"
  ];

  function lerp(a,b,k){ return a + (b-a)*k; }

  const STATE_DESCRIPTIONS = {
    neutral:"idle / balanced", happy:"positive / cheerful", curious:"exploring / interested",
    sleepy:"low energy", listening:"hearing you", thinking:"processing input",
    talking:"speaking / responding", excited:"high energy", sad:"low mood",
    surprised:"unexpected input", angry:"frustrated / blocked", love:"affectionate",
    embarrassed:"shy / awkward", confused:"uncertain / unclear", alert:"attention / warning"
  };

  const stateData = {
    neutral:{scale:1.02,eye:.92,brow:0,mouth:.02,tilt:0,glow:0.2},
    happy:{scale:1.04,eye:.72,brow:-.08,mouth:.13,tilt:0,glow:.7},
    curious:{scale:1.03,eye:1.10,brow:-.20,mouth:.04,tilt:.055,glow:.5},
    sleepy:{scale:1.00,eye:.24,brow:.08,mouth:.02,tilt:-.02,glow:.1},
    listening:{scale:1.05,eye:1.12,brow:-.30,mouth:.01,tilt:0,glow:1},
    thinking:{scale:1.02,eye:.65,brow:-.12,mouth:-.03,tilt:.07,glow:.75},
    talking:{scale:1.05,eye:.96,brow:-.05,mouth:.08,tilt:0,glow:.85},
    excited:{scale:1.08,eye:1.30,brow:-.38,mouth:.17,tilt:0,glow:1},
    sad:{scale:1.00,eye:.70,brow:.30,mouth:-.10,tilt:-.04,glow:.05},
    surprised:{scale:1.08,eye:1.48,brow:-.48,mouth:.23,tilt:0,glow:1},
    angry:{scale:1.02,eye:.78,brow:.42,mouth:-.08,tilt:0,glow:.45},
    love:{scale:1.04,eye:.80,brow:-.12,mouth:.15,tilt:0,glow:1},
    embarrassed:{scale:1.02,eye:.56,brow:.10,mouth:.05,tilt:-.03,glow:.65},
    confused:{scale:1.03,eye:.88,brow:.24,mouth:-.04,tilt:.09,glow:.4},
    alert:{scale:1.05,eye:1.25,brow:-.34,mouth:.03,tilt:0,glow:1}
  };

  let state = "curious";
  let previousState = "curious";
  let stateBlend = 1;
  let talking = false;
  let listening = false;
  let cameraStream = null;
  let micStream = null;
  let recognition = null;
  let bleDevice = null;
  let bleChar = null;
  let audioLevel = 0;
  let lastActivity = performance.now();
  let blink = 0;
  let blinkTimer = 1800 + Math.random()*3000;
  let t = 0;

  const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
  const CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

  function log(msg){
    const line = document.createElement("div");
    line.textContent = "[" + new Date().toLocaleTimeString([], {hour12:false}) + "] " + msg;
    $("#log").prepend(line);
    while($("#log").children.length > 5) $("#log").lastElementChild.remove();
  }

  function showCaption(text, on=true){
    captionText.textContent = text || "Listening…";
    caption.classList.toggle("show", on);
  }

  let captionTimer;
  function hideCaption(ms=1800){
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => caption.classList.remove("show"), ms);
  }

  function setState(next, note="", meta={}){
    if(!stateData[next]) next = "neutral";
    previousState = state;
    state = next;
    stateBlend = 0;
    if(!meta.auto) lastActivity = performance.now();

    $("#stateChip").textContent = next.toUpperCase();
    $("#statusText").textContent = note || state + " · active";
    $("#stateDot").className = "dot " + (
      ["listening","talking","alert","excited","surprised"].includes(state) ? "live" : "ok"
    );

    device.classList.remove(
      "state-listening","state-thinking","state-talking"
    );
    if(state === "listening") device.classList.add("state-listening");
    if(state === "thinking") device.classList.add("state-thinking");
    if(state === "talking") device.classList.add("state-talking");

    document.querySelectorAll(".stateBtn").forEach(b =>
      b.classList.toggle("active", b.dataset.state === state)
    );
    log(note || ("state → " + state));
  }

  /* ---------- Natural idle emotion cycle ----------
     Robo changes state occasionally when nothing is happening, but never
     steals control from real listening/talking/thinking activity. */
  const IDLE_STATES = [
    "neutral", "curious", "happy", "sleepy", "confused", "surprised", "excited"
  ];
  let autoIdleEnabled = true;
  let idleTimer = null;
  let lastAutoState = "curious";

  function scheduleIdleCycle(delay = 5500 + Math.random()*4500){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(runIdleCycle, delay);
  }

  function runIdleCycle(){
    if(!autoIdleEnabled){ scheduleIdleCycle(5000); return; }

    const busy = listening || talking || state === "listening" ||
      state === "talking" || state === "thinking";
    const inactiveLongEnough = performance.now() - lastActivity > 3800;

    if(busy || !inactiveLongEnough){
      scheduleIdleCycle(3500 + Math.random()*2500);
      return;
    }

    const choices = IDLE_STATES.filter(s => s !== lastAutoState);
    let next = choices[Math.floor(Math.random()*choices.length)];

    // Keep the idle personality believable: sleepy is less frequent and
    // surprise/excitement are short-lived accents rather than constant states.
    if(next === "sleepy" && Math.random() < .45) next = "neutral";
    if(next === "surprised" && Math.random() < .35) next = "curious";
    if(next === "excited" && Math.random() < .35) next = "happy";

    lastAutoState = next;
    setState(next, "idle auto · " + next, {auto:true});
    scheduleIdleCycle(5000 + Math.random()*7000);
  }

  function setAutoIdle(on){
    autoIdleEnabled = !!on;
    const btn = $("#autoStateBtn");
    if(btn) btn.textContent = "AUTO IDLE: " + (autoIdleEnabled ? "ON" : "OFF");
    log("automatic idle states → " + (autoIdleEnabled ? "ON" : "OFF"));
    if(autoIdleEnabled) scheduleIdleCycle(1800);
    else clearTimeout(idleTimer);
  }

  /* Start the natural idle personality after the UI has settled. */
  scheduleIdleCycle(5000);

  /* ---------- 3D floating emoji renderer ---------- */
  let rendererErrorShown = false;
  function drawFace(dt){
    try{
      const rect = canvas.getBoundingClientRect();
      const s = Math.max(160, Math.min(rect.width || 400, rect.height || 400));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const px = Math.round(s*dpr);
      if(canvas.width !== px || canvas.height !== px) canvas.width = canvas.height = px;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      t += dt/1000;

      // Natural blinking for the emoji eyes.
      blinkTimer -= dt;
      if(blinkTimer <= 0){
        blink = 0.001;
        blinkTimer = 2600 + Math.random()*3600;
      }
      if(blink > 0){
        blink += dt/110;
        if(blink >= 1.9) blink = 0;
      }

      stateBlend = Math.min(1,stateBlend + dt/260);
      const a = stateData[previousState] || stateData.neutral;
      const b = stateData[state] || stateData.neutral;
      const k = stateBlend < .5 ? 2*stateBlend*stateBlend : 1-Math.pow(-2*stateBlend+2,2)/2;
      const glow = lerp(a.glow,b.glow,k);
      const faceScale = lerp(a.scale||1,b.scale||1,k);
      const cx=s/2, cy=s/2 + Math.sin(t*1.2)*s*.012;
      const r=s*.285*faceScale;

      ctx.clearRect(0,0,s,s);

      // Soft aura
      const aura=ctx.createRadialGradient(cx,cy,r*.45,cx,cy,r*1.75);
      aura.addColorStop(0,`rgba(255,184,72,${.08+glow*.10})`);
      aura.addColorStop(.55,`rgba(255,123,84,${.025+glow*.05})`);
      aura.addColorStop(1,'rgba(255,123,84,0)');
      ctx.fillStyle=aura;
      ctx.beginPath();ctx.arc(cx,cy,r*1.75,0,Math.PI*2);ctx.fill();

      // 3D emoji sphere with highlight and shadow
      ctx.save();
      ctx.shadowColor=`rgba(44,36,64,${.22+glow*.10})`;
      ctx.shadowBlur=s*.055;
      ctx.shadowOffsetY=s*.035;
      const sphere=ctx.createRadialGradient(cx-r*.42,cy-r*.48,r*.05,cx+r*.15,cy+r*.18,r*1.12);
      sphere.addColorStop(0,'#fff6b0');
      sphere.addColorStop(.22,'#ffe66d');
      sphere.addColorStop(.58,'#f7c83f');
      sphere.addColorStop(.84,'#e7a927');
      sphere.addColorStop(1,'#b87412');
      ctx.fillStyle=sphere;
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      ctx.restore();

      // Subtle 3D rim
      const rim=ctx.createRadialGradient(cx-r*.5,cy-r*.5,r*.58,cx,cy,r*1.02);
      rim.addColorStop(.72,'rgba(255,255,255,0)');
      rim.addColorStop(.90,`rgba(255,245,185,${.22+glow*.10})`);
      rim.addColorStop(1,'rgba(122,70,8,.22)');
      ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

      // Specular highlight
      const shine=ctx.createRadialGradient(cx-r*.42,cy-r*.48,0,cx-r*.22,cy-r*.30,r*.42);
      shine.addColorStop(0,'rgba(255,255,255,.72)');
      shine.addColorStop(.22,'rgba(255,255,255,.25)');
      shine.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=shine;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

      // Emotion values
      const eyeOpen=lerp(a.eye,b.eye,k);
      const brow=lerp(a.brow,b.brow,k);
      const mouth=lerp(a.mouth,b.mouth,k);
      const tilt=lerp(a.tilt,b.tilt,k);
      const blinkAmount=blink;
      const talkingNow=state==='talking' || talking;
      const talkOpen=talkingNow ? (0.035 + (0.5+0.5*Math.sin(t*15.5))*0.075) : 0;
      const eyeH=Math.max(.06, eyeOpen*(1-blinkAmount*.95));
      const eyeY=cy-r*.08;
      const eyeGap=r*.62;
      const eyeW=r*.25;
      const eyeHeight=r*.30*eyeH;

      ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);ctx.translate(-cx,-cy);

      // Brows
      [-1,1].forEach(side=>{
        const ex=cx+side*eyeGap;
        const by=eyeY-eyeHeight*1.18+brow*r*.42;
        ctx.strokeStyle='#5b3514';ctx.lineWidth=Math.max(3,s*.013);ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(ex-eyeW*.55,by-side*brow*r*.22);
        ctx.quadraticCurveTo(ex,by-brow*r*.12,ex+eyeW*.55,by+side*brow*r*.22);
        ctx.stroke();
      });

      // Eyes + pupils
      [-1,1].forEach(side=>{
        const ex=cx+side*eyeGap;
        const ey=eyeY;
        const ew=eyeW, eh=eyeHeight;
        ctx.fillStyle='#fffdf7';
        ctx.beginPath();ctx.ellipse(ex,ey,ew,Math.max(ew*.16,eh),0,0,Math.PI*2);ctx.fill();
        const px=ex+Math.sin(t*.9+side)*ew*.08;
        const py=ey+Math.cos(t*.75+side)*eh*.05;
        const pr=Math.min(ew,Math.max(ew*.34,eh*.58));
        const iris=ctx.createRadialGradient(px-pr*.3,py-pr*.35,pr*.08,px,py,pr);
        iris.addColorStop(0,'#bfefff');iris.addColorStop(.38,'#78b9ff');iris.addColorStop(.72,'#7055c8');iris.addColorStop(1,'#26183e');
        ctx.fillStyle=iris;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#141020';ctx.beginPath();ctx.ellipse(px,py,pr*.36,pr*.58,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-pr*.32,py-pr*.34,pr*.19,0,Math.PI*2);ctx.fill();
      });

      // Cheeks / emotion marks
      if(['happy','love','embarrassed','excited'].includes(state)){
        [-1,1].forEach(side=>{
          const bx=cx+side*r*.58, by=cy+r*.25;
          const g=ctx.createRadialGradient(bx,by,0,bx,by,r*.14);
          g.addColorStop(0,'rgba(244,110,93,.42)');g.addColorStop(1,'rgba(244,110,93,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,r*.14,0,Math.PI*2);ctx.fill();
        });
      }
      if(state==='embarrassed'){
        ctx.strokeStyle='rgba(210,85,70,.6)';ctx.lineWidth=s*.008;ctx.lineCap='round';
        for(const side of [-1,1]){
          for(let j=0;j<3;j++){
            const x=cx+side*(r*.52+j*r*.08);const y=cy+r*(.18+j*.04);
            ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*r*.045,y+r*.035);ctx.stroke();
          }
        }
      }
      if(state==='sad'){
        ctx.strokeStyle='rgba(70,150,220,.8)';ctx.lineWidth=s*.012;ctx.lineCap='round';
        [-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(cx+side*eyeGap,eyeY+eyeHeight*.65);ctx.lineTo(cx+side*eyeGap,eyeY+eyeHeight*1.05);ctx.stroke()});
      }
      if(state==='love'){
        ctx.fillStyle='rgba(239,127,174,.9)';
        [-1,1].forEach(side=>{const hx=cx+side*eyeGap,hy=eyeY;const hs=r*.10;ctx.beginPath();ctx.moveTo(hx,hy+hs);ctx.bezierCurveTo(hx-hs*1.8,hy-hs*.1,hx-hs,hy-hs*1.45,hx,hy-hs*.55);ctx.bezierCurveTo(hx+hs,hy-hs*1.45,hx+hs*1.8,hy-hs*.1,hx,hy+hs);ctx.fill()});
      }

      // Mouth. Shape changes by state and talking animation.
      const mw=r*.62;
      const my=cy+r*.38;
      ctx.strokeStyle='#5b3514';ctx.lineWidth=Math.max(4,s*.016);ctx.lineCap='round';ctx.lineJoin='round';
      if(talkingNow){
        ctx.fillStyle='#6b2c25';ctx.beginPath();ctx.ellipse(cx,my,mw*.34,Math.max(r*.055,talkOpen*r*1.7),0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(cx,my-r*.01,mw*.20,r*.022,0,0,Math.PI*2);ctx.fill();
      }else if(['happy','excited','love'].includes(state)){
        ctx.fillStyle='#5b3514';ctx.beginPath();ctx.arc(cx,my,r*.16,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#f07d73';ctx.beginPath();ctx.ellipse(cx,my+r*.055,r*.09,r*.045,0,0,Math.PI*2);ctx.fill();
      }else if(['sad','confused'].includes(state)){
        ctx.beginPath();ctx.moveTo(cx-mw*.42,my+r*.04);ctx.quadraticCurveTo(cx,my-mouth*r*.95,cx+mw*.42,my+r*.04);ctx.stroke();
      }else if(state==='surprised' || state==='alert'){
        ctx.fillStyle='#5b3514';ctx.beginPath();ctx.ellipse(cx,my,r*.13,r*(.10+Math.max(0,mouth)*.25),0,0,Math.PI*2);ctx.fill();
      }else if(state==='angry'){
        ctx.beginPath();ctx.moveTo(cx-mw*.42,my);ctx.quadraticCurveTo(cx,my+r*.08,cx+mw*.42,my);ctx.stroke();
      }else{
        ctx.beginPath();ctx.moveTo(cx-mw*.42,my);ctx.quadraticCurveTo(cx,my+mouth*r*.45,cx+mw*.42,my);ctx.stroke();
      }
      ctx.restore();

      // Tiny floating particles make the avatar feel alive.
      const particleColor = state==='angry'||state==='alert' ? '#ff7654' : state==='love' ? '#ef7fae' : '#5fd4d0';
      for(let i=0;i<4;i++){
        const ang=t*(.45+i*.06)+i*1.6;
        const px2=cx+Math.cos(ang)*r*(1.15+i*.08);
        const py2=cy+Math.sin(ang*1.15)*r*(.85+i*.05);
        ctx.fillStyle=particleColor;ctx.globalAlpha=.25+.08*Math.sin(t+i);
        ctx.beginPath();ctx.arc(px2,py2,s*(.006+i*.001),0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;

      const fallback = $('#emojiFallback');
      if(fallback) fallback.classList.add('hidden');
    }catch(err){
      console.error('ROBO emoji renderer error:',err);
      if(!rendererErrorShown){
        rendererErrorShown=true;
        const fallback=$('#emojiFallback');
        if(fallback) fallback.classList.remove('hidden');
        showCaption('Avatar renderer error — fallback emoji active.',true);
        hideCaption(5000);
      }
    }
  }

  let lastFrame=performance.now();
  function frame(now){
    const dt=Math.min(50,now-lastFrame);lastFrame=now;
    drawFace(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Media + microphone diagnostic ---------- */
  let micPermissionGranted=false;
  let audioContext=null, analyser=null, analyserData=null, analyserRAF=null;

  function setVoiceDiag(kind,text){
    voiceDiagDot.className="diagDot "+(kind||"");
    voiceDiagText.textContent=text;
    voiceLevel.classList.toggle("active",kind==="live");
  }

  function stopMicStream(){
    if(micStream){
      micStream.getTracks().forEach(track=>{try{track.stop()}catch(_){}});
      micStream=null;
    }
    if(analyserRAF) cancelAnimationFrame(analyserRAF);
    analyserRAF=null;
    if(audioContext){
      try{audioContext.close()}catch(_){}
      audioContext=null;
    }
    analyser=null;
    analyserData=null;
    [...voiceLevel.children].forEach((el,i)=>el.style.height=(4+i%2*2)+"px");
  }

  function startMicMeter(stream){
    try{
      if(!window.AudioContext && !window.webkitAudioContext) return;
      const AC=window.AudioContext||window.webkitAudioContext;
      audioContext=new AC();
      const source=audioContext.createMediaStreamSource(stream);
      analyser=audioContext.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=.72;
      analyserData=new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      const tick=()=>{
        if(!analyser || !analyserData) return;
        analyser.getByteTimeDomainData(analyserData);
        let sum=0;
        for(let i=0;i<analyserData.length;i++){const v=(analyserData[i]-128)/128;sum+=v*v}
        const rms=Math.min(1,Math.sqrt(sum/analyserData.length)*4.2);
        [...voiceLevel.children].forEach((el,i)=>{
          const wobble=.55+.45*Math.sin(performance.now()/105+i*1.7);
          const h=Math.max(3,Math.round(4+rms*22*wobble*(1+i*.08)));
          el.style.height=h+"px";
        });
        analyserRAF=requestAnimationFrame(tick);
      };
      tick();
    }catch(err){console.warn("voice meter unavailable",err)}
  }

  async function requestMicPermission(){
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("Microphone API unavailable");
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},
      video:false
    });
    micPermissionGranted=true;
    // Diagnostic stream is deliberately temporary. SpeechRecognition must own
    // the microphone when STT starts; leaving this stream open causes Android/
    // Chrome speech services to report that the microphone cannot be recorded.
    startMicMeter(stream);
    setVoiceDiag("ready","MIC READY · STT READY");
    micStream=stream;
    return stream;
  }

  function prepareSpeechMic(){
    // Release every getUserMedia audio track immediately before
    // SpeechRecognition.start(). Keeping both open is the conflict we are fixing.
    stopMicStream();
    setVoiceDiag("live","MIC HANDED TO STT");
  }

  async function startCamera(){
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API unavailable");
    if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},
      audio:false
    });
    $("#camera").srcObject=cameraStream;
    $("#cameraBox").classList.remove("empty");
    await $("#camera").play().catch(()=>{});
  }

  async function enableMedia(){
    try{
      await startCamera();
      await requestMicPermission();
      $("#mediaDot").className="dot ok";
      $("#mediaText").textContent="CAM + MIC OK";
      showCaption("Camera ready. Microphone permission granted; voice input is ready.",true);
      hideCaption(3200);
      log("camera ready + microphone permission granted");
    }catch(err){
      console.warn(err);
      stopMicStream();
      $("#mediaDot").className="dot";
      $("#mediaText").textContent="MEDIA BLOCKED";
      setVoiceDiag("error","MIC ERROR · "+(err.name||"ACCESS"));
      showCaption("Allow camera + microphone access in Chrome site settings.",true);
      log("media error: "+err.name+" "+err.message);
    }
  }
  $("#mediaBtn").addEventListener("click",enableMedia);
  $("#cameraBox").addEventListener("click",enableMedia);

  /* ---------- Speech recognition ---------- */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recognition=new SR();
    recognition.continuous=false;
    recognition.interimResults=true;
    recognition.maxAlternatives=1;
    recognition.lang="en-US";
    if("processLocally" in recognition) recognition.processLocally=false;

    recognition.onstart=()=>{
      listening=true;micBtn.classList.add("listening");setState("listening","listening · capturing audio");
      setVoiceDiag("live","MIC ACTIVE · STT LISTENING");
      showCaption("Listening…",true);
    };
    recognition.onaudiostart=()=>setVoiceDiag("live","AUDIO INPUT · STT ACTIVE");
    recognition.onsoundstart=()=>setVoiceDiag("live","SOUND DETECTED · STT ACTIVE");
    recognition.onspeechstart=()=>setVoiceDiag("live","VOICE DETECTED · TRANSCRIBING");
    recognition.onspeechend=()=>setVoiceDiag("live","VOICE ENDED · FINALIZING");
    recognition.onsoundend=()=>setVoiceDiag("live","SOUND ENDED · FINALIZING");
    recognition.onaudioend=()=>setVoiceDiag("live","AUDIO RELEASE · FINALIZING");

    recognition.onresult=(e)=>{
      let interim="";
      let finalText="";
      for(let i=0;i<e.results.length;i++){
        const tx=e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText+=tx+" "; else interim+=tx+" ";
      }
      const text=(finalText||interim).trim();
      if(text) showCaption(text,true);
      if(finalText.trim()){
        const q=finalText.trim();
        setState("thinking","thinking · processing your words");
        setTimeout(()=>respond(q),350);
      }
    };
    recognition.onerror=(e)=>{
      listening=false;micBtn.classList.remove("listening");
      setVoiceDiag("error","STT ERROR · "+(e.error||"unknown"));
      setState("confused","voice · "+(e.error||"error"));
      const msg={
        "not-allowed":"Microphone permission was blocked.",
        "service-not-allowed":"Speech service is unavailable.",
        "audio-capture":"Speech service could not access the microphone.",
        "network":"Speech recognition needs a network connection.",
        "no-speech":"No speech detected. Try again.",
        "aborted":"Listening stopped."
      }[e.error] || ("Voice error: "+e.error);
      showCaption(msg,true);
      hideCaption(5000);
    };
    recognition.onend=()=>{
      listening=false;micBtn.classList.remove("listening");
      if(!talking){
        setVoiceDiag(micPermissionGranted?"ready":"","MIC READY · STT READY");
        setState("curious","curious · standing by");
      }
    };
  }

  function respond(text){
    const l=text.toLowerCase();
    let reply;
    if(/\b(hi|hello|hey)\b/.test(l)){setState("happy","happy · greeting");reply="Hey! Good to see you."}
    else if(/how are you/.test(l)){setState("happy","happy · responding");reply="I'm doing great. All systems are ready."}
    else if(/love|cute|good boy|good robot/.test(l)){setState("love","love · positive signal");reply="That makes my circuits happy."}
    else if(/sad|bad|upset/.test(l)){setState("sad","sad · empathy mode");reply="I'm listening. Tell me what happened."}
    else if(/angry|mad/.test(l)){setState("angry","angry · defensive mode");reply="I hear you. Let's slow down and solve it."}
    else if(/surprise|wow/.test(l)){setState("surprised","surprised · unexpected input");reply="Whoa. I did not expect that."}
    else if(/think|thinking|question/.test(l)){setState("thinking","thinking · processing");reply="Give me a moment to think about that."}
    else if(/forward|back|left|right|stop|move/.test(l)){setState("alert","control request · awaiting robot link");reply="I received the movement command, but the robot link is not online."}
    else {setState("curious","curious · request received");reply="I heard you. My local brain is still limited, but the voice pipeline is working."}
    speak(reply);
  }

  function speak(text){
    showCaption(text,true);
    if(!("speechSynthesis" in window)){setState("curious","speech output unavailable");return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.pitch=1.12;u.rate=1.0;
    u.onstart=()=>{talking=true;micBtn.classList.add("talking");setState("talking","talking · Robo is speaking")}
    u.onend=()=>{talking=false;micBtn.classList.remove("talking");setState("curious","curious · standing by");hideCaption(1800)}
    u.onerror=()=>{talking=false;micBtn.classList.remove("talking");setState("curious","speech stopped")}
    speechSynthesis.speak(u);
  }

  micBtn.addEventListener("click",async()=>{
    lastActivity=performance.now();
    if(!recognition){
      setVoiceDiag("error","STT UNSUPPORTED");
      showCaption("Speech recognition is not supported here. Use Chrome on Android/desktop.",true);
      hideCaption(5000);return;
    }
    if(listening){recognition.stop();return}

    try{
      if(!micPermissionGranted){
        await requestMicPermission();
      }
      prepareSpeechMic();

      // SpeechRecognition now owns the microphone. We do NOT keep a
      // getUserMedia audio track open at the same time.
      recognition.start();
      log("speech recognition start requested after mic hand-off");
    }catch(e){
      console.warn("speech start failed",e);
      setVoiceDiag("error","STT START FAILED");
      showCaption("Could not start speech recognition. Tap again and retry.",true);
      hideCaption(5000);
    }
  });

  /* ---------- Orientation test ---------- */
  function setOrientation(land){
    device.classList.toggle("landscape",land);
    $("#orientationBtn").textContent=land?"PORTRAIT TEST":"LANDSCAPE TEST";
    log("orientation test → "+(land?"landscape":"portrait"));
  }
  $("#orientationBtn").addEventListener("click",()=>setOrientation(!device.classList.contains("landscape")));

  /* ---------- Developer states ---------- */
  const stateGrid=$("#stateGrid");
  STATES.forEach(s=>{
    const b=document.createElement("button");
    b.className="stateBtn";b.dataset.state=s;
    b.innerHTML = `<span>${s}</span><small>${STATE_DESCRIPTIONS[s]}</small>`;
    b.addEventListener("click",()=>setState(s,"developer test · "+s));
    stateGrid.appendChild(b);
  });
  $("#devBtn").addEventListener("click",()=>$("#devPanel").classList.toggle("open"));
  $("#closeDev").addEventListener("click",()=>$("#devPanel").classList.remove("open"));
  $("#autoStateBtn").addEventListener("click",()=>setAutoIdle(!autoIdleEnabled));

  /* ---------- BLE / ESP32 scaffold ---------- */
  function bleStatus(on){
    $("#bleDot").className="dot "+(on?"ok":"");
    $("#bleText").textContent=on?"ROBOT ONLINE":"ROBOT OFFLINE";
  }
  $("#bleBtn").addEventListener("click",async()=>{
    if(!navigator.bluetooth){
      showCaption("Web Bluetooth is unavailable in this browser. Use Chrome/Edge with HTTPS.",true);hideCaption(5000);return;
    }
    try{
      bleDevice=await navigator.bluetooth.requestDevice({
        filters:[{services:[SERVICE_UUID]}],
        optionalServices:[SERVICE_UUID]
      });
      const server=await bleDevice.gatt.connect();
      const service=await server.getPrimaryService(SERVICE_UUID);
      bleChar=await service.getCharacteristic(CHAR_UUID);
      bleStatus(true);setState("happy","robot · BLE connected");speak("Robot body connected.");
      bleDevice.addEventListener("gattserverdisconnected",()=>{bleChar=null;bleStatus(false);});
    }catch(e){
      console.warn(e);bleStatus(false);log("BLE connection cancelled/failed");
    }
  });

  /* ---------- Safe startup ---------- */
  setState("curious","curious · standing by");
  $("#battery").textContent="82%";
  log("ROBO AIOS v2.7 booted");
  log("3D floating emoji renderer online");
  log("camera + mic permission ready; speech mic hand-off enabled");
  log("natural idle emotion cycle → ON");

  /* Developer convenience: desktop starts in portrait simulator. */
  const mq=window.matchMedia("(orientation: landscape)");
  if(mq.matches && innerWidth>700) setOrientation(true);
})();
</script>
</body>
</html>
